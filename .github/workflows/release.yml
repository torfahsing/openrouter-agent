name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.output }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: bun-linux-x64
            output: openrouter-agent-linux-x64
          - target: bun-linux-arm64
            output: openrouter-agent-linux-arm64
          - target: bun-darwin-x64
            output: openrouter-agent-darwin-x64
          - target: bun-darwin-arm64
            output: openrouter-agent-darwin-arm64
          - target: bun-windows-x64
            output: openrouter-agent-windows-x64.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run tests
        if: matrix.target == 'bun-linux-x64'
        run: bun test

      - name: Compile standalone binary
        run: |
          mkdir -p dist
          bun build --compile --minify ./src/cli.ts --target=${{ matrix.target }} --outfile=dist/${{ matrix.output }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output }}
          path: dist/${{ matrix.output }}

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          ls -la

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
